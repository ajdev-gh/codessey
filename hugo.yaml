baseURL: https://ajdev-gh.github.io/codessey/
locale: en-us
title: The Codessey
theme: PaperMod

taxonomies:
  tag: "tags"
  category: "categories"

menu:
  main:
    - identifier: posts
      name: "Posts"
      url: "/posts/"
      weight: 10

    - identifier: tags
      name: "Tags"
      url: "/tags/"
      weight: 15

    - identifier: archives
      name: "Archive"
      url: "/archives/"
      weight: 20

    - identifier: about
      name: "About"
      url: "/about/"
      weight: 30

    - identifier: github
      name: "GitHub"
      url: "https://github.com/ajdev-gh/codessey"
      weight: 40

params:
  homeInfoParams:
    Title: Welcome to The Codessey
    Content: Charting the unknown, one line of code at a time  

  socialIcons:
    - name: "github"
      url: "https://github.com/ajdev-gh"
    - name: "leetcode"
      url: "https://leetcode.com/u/ajaidev"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/ajai-dev-658676413/"
    - name: "reddit"
      url: "https://reddit.com/u/Devorik"


  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowReadingTime: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - '$$'
              - '$$'
            - - '\['
              - '\]'
          inline:
            - - '$'
              - '$'
            - - '\('
              - '\)'
